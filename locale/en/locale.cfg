[mod-setting-name]
rcs-page=Companion page: design and preview your curve
rcs-curve=Cost curve

[mod-setting-description]
rcs-page=Copy this address into your browser: click the field, press Ctrl+A, then Ctrl+C.\nThe page shows every tech's cost in this modpack under any curve, and gives you the line to paste into Cost curve below.\n(This field is only here so the address can be copied. Changing it does nothing.)
rcs-curve=Multiplier on research costs, by how far into the tech tree each tech is (0 = first research, 1 = most expensive).\nFormat: v1; pts=x:multiplier, x:multiplier, ...\nOptional: inf=multiplier for infinite techs; time=research time multiplier\n\nThe easiest way to make one is the companion page (address in the setting above). It needs this modpack's export, which is written to script-output/research-cost-shaper/rcs-export.txt every time Factorio starts, or type /rcs-export in game.

[rcs]
command-help=Shows the Research Cost Shaper export for this modpack, to paste into the companion web page.
export-title=Research Cost Shaper export
export-step-page=1. Open the companion page in your browser:
export-step-copy=2. Copy all of this text (__1__ characters) and paste it into the page with Paste export:
export-step-file=The same text is saved as script-output/research-cost-shaper/rcs-export.txt, which you can open on the page instead.
close=Close
select=Select
select-tooltip=Selects the whole field. Then press Ctrl+C to copy it (Factorio doesn't let mods copy to your clipboard directly).
copy-hint=Selected. Press Ctrl+C to copy.
check-help=Checks that every tech still has the cost Research Cost Shaper set (another mod or the map's price multiplier can change them).
check-ok=Research Cost Shaper: all __1__ __plural_for_parameter__1__{1=tech has|rest=techs have}__ the costs it set.
check-changed=Research Cost Shaper: __1__ __plural_for_parameter__1__{1=tech was|rest=techs were}__ changed after it applied the curve, by a mod that loads later: __2__
check-added=Research Cost Shaper: __1__ __plural_for_parameter__1__{1=tech was|rest=techs were}__ added after it ran, so the curve doesn't cover __plural_for_parameter__1__{1=it|rest=them}__: __2__
check-missing=Research Cost Shaper: __1__ __plural_for_parameter__1__{1=tech it shaped was|rest=techs it shaped were}__ removed afterwards: __2__
check-multiplier=Research Cost Shaper: the map's technology price multiplier is ×__1__, which multiplies every cost on top of the curve.
check-more=Type /rcs-check to check again. Full details are in factorio-current.log.
intro=[Research Cost Shaper] Design and preview this game's research costs at __1__ (type /rcs-export for a copyable link).
