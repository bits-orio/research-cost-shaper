[mod-setting-name]
rcs-curve=Cost curve

[mod-setting-description]
rcs-curve=Multiplier applied to research costs, by how far into the tech tree each tech is (0 = first research, 1 = most expensive).\nFormat: v1; pts=x:multiplier, x:multiplier, ...\nOptional: inf=<multiplier for infinite techs>; time=<research time multiplier>\nDesign and preview curves on the companion page linked from the mod portal.
