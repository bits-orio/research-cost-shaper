[mod-setting-name]
rcs-curve=Cost curve

[mod-setting-description]
rcs-curve=Multiplier applied to research costs, by how far into the tech tree each tech is (0 = first research, 1 = most expensive).\nFormat: v1; pts=x:multiplier, x:multiplier, ...\nOptional: inf=<multiplier for infinite techs>; time=<research time multiplier>\n\nDesign and preview curves at bits-orio.github.io/research-cost-shaper\nThis modpack's export for that page is written to script-output/research-cost-shaper/export.txt every time Factorio starts (or type /rcs-export in game).

[rcs]
command-help=Shows the Research Cost Shaper export for this modpack, to paste into the companion web page.
export-title=Research Cost Shaper export
export-step-page=1. Open the companion page (copy this address into your browser):
export-step-copy=2. Copy all of this text (__1__ characters, already selected) and paste it into the page:
export-step-file=The same text is saved as script-output/research-cost-shaper/export.txt, which you can open on the page instead.
close=Close
