# Research Cost Shaper's settings for the test harness.
# The dev/*.sh harness files are copies of the factorio-client-testing
# skill's reference/ folder; this file is the repo's own part. The names
# are explained in dev/harness-lib.sh.
ABBR=RCS
SETS=(space-age base)  # run-gui.sh opens the first one
MP_PORT=34302
PRE_TESTS=("bash tools/test.sh")  # Lua tests on Lua 5.2 via lupa, and the JS tests

# RCS_CURVE=<curve> runs with that Cost curve startup setting. Startup settings
# live in mod-settings.dat; the simple way to set one without the GUI is to
# change the default the mod declares, in a copy.
harness_stage_hook() { # <mods dir>
  [ -n "${RCS_CURVE:-}" ] || return 0
  rm -rf "${1:?}/$MOD"
  rsync -a --exclude .git --exclude .run --exclude site --exclude worker "$REPO/" "$1/$MOD/"
  sed -i "s|default_value = \"v1; pts=0:2, 0.5:4, 1:10\"|default_value = \"${RCS_CURVE}\"|" "$1/$MOD/settings.lua"
  [ -z "$ENGINE_VERSION" ] || harness_patch_version "$1/$MOD"  # the copy loads on a 2.1 binary too
}
