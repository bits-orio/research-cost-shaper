name: Deploy share worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run worker tests
        run: node --test worker/test/*.test.mjs

      - name: Check for Cloudflare credentials
        run: echo "HAS_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Workers
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Skip deploy (no Cloudflare token configured)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set, skipping deploy. Tests still ran above."
